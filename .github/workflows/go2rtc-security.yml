name: go2rtc security checks

on:
  push:
    branches:
      - master
      - security/go2rtc-hardening
    paths:
      - "go2rtc/**"
      - ".github/workflows/go2rtc-security.yml"
  pull_request:
    paths:
      - "go2rtc/**"
      - ".github/workflows/go2rtc-security.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned go2rtc source
        run: |
          git clone https://github.com/AlexxIT/go2rtc.git /tmp/go2rtc
          cd /tmp/go2rtc
          git checkout b5948cfb25404cc5cb37b166ecaa2dca20b11d4b

      - name: Apply security patches
        run: |
          cp go2rtc/scripts/apply-security-patches.py /tmp/go2rtc/apply-security-patches.py
          cd /tmp/go2rtc
          python3 apply-security-patches.py

      - name: Verify hardened endpoints
        run: |
          ! grep -q 'HandleFunc("api/config"' /tmp/go2rtc/internal/api/api.go
          ! grep -q 'HandleFunc("api/restart"' /tmp/go2rtc/internal/api/api.go
          ! grep -q 'HandleFunc("api/exit"' /tmp/go2rtc/internal/api/api.go
          ! grep -q 'HandleFunc("api/log"' /tmp/go2rtc/internal/api/api.go
          grep -q 'HandleFunc("api/xiaomi"' /tmp/go2rtc/internal/xiaomi/xiaomi.go
          grep -q 'allowPaths = \[\]string{"ffmpeg"}' /tmp/go2rtc/internal/exec/exec.go

      - name: Compile security-sensitive packages
        working-directory: /tmp/go2rtc
        run: |
          go test ./internal/api ./internal/exec ./internal/xiaomi
          go test ./pkg/xiaomi/...

      - name: Build amd64 binary
        working-directory: /tmp/go2rtc
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/go2rtc-bin .

  addon-image-integration:
    runs-on: ubuntu-latest
    needs: patch-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Home Assistant amd64 base image
        run: |
          BUILD_FROM="$(awk '/^  amd64:/{print $2; exit}' go2rtc/config.yaml)"
          test -n "$BUILD_FROM"
          echo "BUILD_FROM=$BUILD_FROM" >> "$GITHUB_ENV"
          echo "Using BUILD_FROM=$BUILD_FROM"

      - name: Build Home Assistant add-on image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --pull \
            --build-arg BUILD_FROM="$BUILD_FROM" \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --build-arg GO2RTC_REF=b5948cfb25404cc5cb37b166ecaa2dca20b11d4b \
            --tag go2rtc-secure:ci \
            ./go2rtc

      - name: Start patched go2rtc container
        run: |
          mkdir -p /tmp/go2rtc-ci-config
          cat > /tmp/go2rtc-ci-config/go2rtc.yaml <<'EOF'
          api:
            listen: ":1984"
          log:
            level: info
          EOF

          docker run -d \
            --name go2rtc-secure-ci \
            -p 127.0.0.1:11984:1984 \
            -v /tmp/go2rtc-ci-config:/config \
            go2rtc-secure:ci

          echo "go2rtc container started:"
          docker ps --filter name=go2rtc-secure-ci

      - name: Wait for HTTP API
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11984/api >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "go2rtc did not become ready"
          docker logs go2rtc-secure-ci || true
          exit 1

      - name: Verify dangerous admin endpoints are unavailable
        run: |
          set -euo pipefail

          assert_404() {
            method="$1"
            path="$2"
            code="$(curl -sS -o /tmp/http-body -w '%{http_code}' -X "$method" "http://127.0.0.1:11984$path")"
            if [ "$code" != "404" ]; then
              echo "Expected $method $path -> 404, got $code"
              cat /tmp/http-body || true
              docker logs go2rtc-secure-ci || true
              exit 1
            fi
            echo "PASS: $method $path -> 404"
          }

          assert_404 GET /api/config
          assert_404 PATCH /api/config
          assert_404 POST /api/restart
          assert_404 POST /api/exit?code=0
          assert_404 GET /api/log

      - name: Verify Xiaomi API remains available
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/xiaomi.json -w '%{http_code}' http://127.0.0.1:11984/api/xiaomi)"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          with open("/tmp/xiaomi.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert isinstance(data, list), data
          print("PASS: GET /api/xiaomi -> 200 with JSON list")
          PY

      - name: Show container logs
        if: always()
        run: docker logs go2rtc-secure-ci || true

      - name: Stop integration container
        if: always()
        run: docker rm -f go2rtc-secure-ci || true

  upstream-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest upstream release
        run: |
          python3 - <<'PY'
          import json, urllib.request
          pinned = "v1.9.14"
          with urllib.request.urlopen("https://api.github.com/repos/AlexxIT/go2rtc/releases/latest") as r:
              latest = json.load(r)["tag_name"]
          print("Pinned:", pinned)
          print("Latest:", latest)
          if latest != pinned:
              print(f"::warning title=go2rtc upstream update available::{latest} is newer than {pinned}; review and rebase the security patch.")
          PY
